
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

issueTrackerURL="https://github.com/Flix100000/HSTG-Permissions/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="Bananemdnsa"

displayURL="https://github.com/Flix100000/HSTG-Permissions/wiki"

description='''
Ties commands to History Stages. Whoever has the stage may use the command, operator or not. Everyone else may not, operators included.

Lock /gamemode creative until the world reaches a stage, or give /kick and /tp to a moderator role without handing out operator rights. Entries go down to single subcommands, and a stage with * gives its holders everything.

Also adds ranks (prefix and suffix per role stage, shown in chat, tab list and on name tags), a Commands tab in the stage editor, and /hstgperms check and verbose to see who may run what.

Dangerous commands like /op and /stop can never be handed out, and /history can never be taken away.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="historystages"
    type="required"
    versionRange="${hstg_version_range}"
    ordering="AFTER"
    side="BOTH"
